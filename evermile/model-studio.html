<!doctype html><html lang="en"><meta charset="utf-8"><base href="/evermile/"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Evermile · Model Studio</title>
<style>*{box-sizing:border-box}body{margin:0;background:#d6d8d3;color:#25302b;font-family:system-ui}canvas{display:block}header{position:absolute;left:32px;top:24px}h1{font-size:24px;font-weight:500;margin:0}p{font-size:13px;color:#526057}nav{position:absolute;bottom:26px;left:24px;right:24px;display:flex;flex-wrap:wrap;gap:8px;max-height:150px;overflow:auto;padding:4px;background:#d6d8d3e8;border-radius:18px}button,a{padding:12px 16px;border:1px solid #87988b;border-radius:25px;background:#e6e8e1;color:#25302b;font-size:13px;text-decoration:none;cursor:pointer}button[aria-pressed=true]{background:#243b30;color:white}#status{position:absolute;right:28px;top:24px;font-size:12px}#status.error{color:#a62020}</style>
<header><h1>Evermile · Model Studio</h1><p>Drag to orbit · Scroll to zoom · Inspect the actual game models</p></header><span id="status">Loading</span><div style="position:absolute;top:110px;left:24px;display:flex;gap:8px"><button id="motion">Pause motion</button><button data-steer="0.32">Steer left</button><button data-steer="0">Straight</button><button data-steer="-0.32">Steer right</button><button id="reverse">Reverse</button></div><nav><button data-model="crowd">Crowd</button><button data-model="citizen">Commuter</button><button data-model="citizen1">Backpacker</button><button data-model="citizen2">Older adult</button><button data-model="citizen3">Summer outfit</button><button data-model="citizen4">Curly hair</button><button data-model="citizen5">Daypack</button><button data-model="michelle">Michelle · imported</button><button data-model="soldier">Vanguard · imported</button><button data-model="cow">Cow</button><button data-model="horse">Horse</button><button data-model="bighorn">Bighorn</button><button data-model="dog">Dog</button><button data-model="cat">Cat</button><button data-model="sedan">Saloon</button><button data-model="hatch">Hatchback</button><button data-model="suv">SUV</button><button data-model="wagon">Estate</button><button data-model="pickup">Pickup</button><button data-model="van">Delivery van</button><button data-model="fox">Fox</button><button data-model="place-apartments">Apartments</button><button data-model="place-brick-works">Brick works</button><button data-model="place-coastal-fort">Coastal fort</button><button data-model="mercedes">Mercedes W201</button><button data-model="train-supplied">Locomotive</button><button data-model="coupe">Sports car</button><button data-model="coach">Coach</button><button data-model="bus">City bus</button><button data-model="prop-pump">Fuel pump</button><button data-model="prop-shop">Station shop</button><button data-model="prop-canopy">Station canopy</button><button data-model="prop-signal">Traffic signal</button><button data-model="bike">Motorcycle</button><a href="./">Return to driving ↗</a><a href="ASSET-CREDITS.md" target="_blank" rel="noopener">Model credits ↗</a></nav>
<script type="module">
import {prepareTrain} from './train-model.js?v=20260926-supplied7';
import {citizenAssets,fitCitizen} from './citizen-assets.js?v=20260926-supplied7';
import {animalAssets,animatedAnimal} from './animated-assets.js?v=20260926-supplied7';
import {TrafficModels} from './traffic-models.js?v=20260926-supplied7';
import {Life} from './life.js?v=20260926-supplied7';import {motorcycleLean} from './wheel-rig.js?v=20260926-supplied7';
import * as T from './vendor/three.module.js';import {GLTFLoader} from './vendor/loaders/GLTFLoader.js';import {OrbitControls} from './vendor/controls/OrbitControls.js';import {addMicroSurface} from './surface-detail.js?v=20260926-supplied7';import {Vehicle} from './vehicle.js?v=20260926-supplied7';
const scene=new T.Scene();scene.background=new T.Color(0xd6d8d3);const camera=new T.PerspectiveCamera(38,innerWidth/innerHeight,.02,200);const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1;document.body.append(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.maxPolarAngle=Math.PI*.49;controls.minDistance=1;controls.maxDistance=150;
scene.add(new T.HemisphereLight(0xffffff,0x7a8274,2));const sun=new T.DirectionalLight(0xfff0dc,3);sun.position.set(7,10,6);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-12,right:12,top:12,bottom:-12});sun.shadow.normalBias=.025;scene.add(sun);const fill=new T.DirectionalLight(0xc5ddff,1.5);fill.position.set(-6,5,-5);scene.add(fill);
const floor=new T.Mesh(new T.PlaneGeometry(200,200),new T.MeshStandardMaterial({color:0xa9afa2,roughness:.9}));floor.rotation.x=-Math.PI/2;floor.position.y=-.01;floor.receiveShadow=true;scene.add(floor);
let model,mixer,animalAnimation,vehicle,traffic,trafficLibrary,selection=0,steer=0,moving=true,direction=1;let crowdMixers=[];const cache=new Map();const loader=new GLTFLoader();
async function select(kind){const ticket=++selection;if(model)scene.remove(model);if(vehicle){vehicle.dispose();vehicle=null;}mixer=null;animalAnimation=null;crowdMixers=[];traffic=null;document.querySelectorAll('[data-model]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.model===kind));document.getElementById('status').className='';document.getElementById('status').textContent='Loading '+kind;
try{if(['sedan','hatch','suv','wagon','pickup','van','bus'].includes(kind)){trafficLibrary ||= new Life({scene:new T.Scene(),world:{road:{side:1}},settings:{},getState:()=>({})});traffic=kind==='bus'?trafficLibrary.bus():trafficLibrary.car(kind);const loaded=await loader.loadAsync('./assets/models/road-'+kind+'.glb');if(ticket!==selection)return;const importer=Object.create(TrafficModels.prototype);importer.loaded={[kind]:loaded.scene};importer.attach(traffic);traffic.detailFallback.forEach(o=>o.visible=false);model=traffic.g;model.remove(traffic.beam);scene.add(model);}else if(kind==='crowd'){const assets=await Promise.all(citizenAssets.map(([key])=>'citizen-'+key).map(file=>loader.loadAsync('./assets/models/'+file+'.glb?v=supplied7')));if(ticket!==selection)return;model=new T.Group();assets.forEach((g,i)=>{fitCitizen(g.scene,i);g.scene.position.x=(i%6-2.5)*.8;g.scene.position.z=Math.floor(i/6)*1.5;model.add(g.scene);const mx=new T.AnimationMixer(g.scene);mx.clipAction(g.animations.find(a=>a.name==='Walk')).play().time=i*.17;crowdMixers.push(mx);});scene.add(model);}else if((kind.startsWith('place-')||kind.startsWith('prop-'))){const g=await loader.loadAsync('./assets/models/'+kind+'.glb?v=supplied7');if(ticket!==selection)return;model=g.scene;scene.add(model);}else if(citizenAssets.some(([key])=>key===kind)){const g=await loader.loadAsync('./assets/models/citizen-'+kind+'.glb?v=supplied7');if(ticket!==selection)return;model=g.scene;fitCitizen(model);scene.add(model);mixer=new T.AnimationMixer(model);mixer.clipAction(g.animations.find(a=>a.name==='Walk')).play();}else if(animalAssets[kind]){const g=await loader.loadAsync('./assets/models/'+animalAssets[kind].file+'.glb?v=supplied7');if(ticket!==selection)return;animalAnimation=animatedAnimal(g,kind);model=animalAnimation.root;scene.add(model);}else if(kind==='train-supplied'){const g=await loader.loadAsync('./assets/models/train-supplied.glb?v=supplied7');if(ticket!==selection)return;const prepared=prepareTrain(g);model=prepared.model;traffic={detailWheels:prepared.wheels};scene.add(model);}else if(['coupe','coach','bike','mercedes'].includes(kind)){vehicle=new Vehicle(scene,kind,'#426e79');const current=vehicle;await current.ready;if(ticket!==selection)return;model=current.group;}else{const file={citizen:'pedestrian-0',...Object.fromEntries(Array.from({length:6},(_,i)=>['citizen'+i,'pedestrian-'+i])),michelle:'citizen-michelle',soldier:'citizen-soldier',cow:'cow-imported',dog:'dog-imported',cat:'cat-imported',traffic:'traffic-car',fox:'fox-imported'}[kind];const g=await loader.loadAsync('./assets/models/'+file+'.glb?v=supplied7');if(ticket!==selection)return;model=g.scene;scene.add(model);if(g.animations.length){mixer=new T.AnimationMixer(model);mixer.clipAction(g.animations.find(a=>a.name==='Walk')||g.animations[0]).play();}}
model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=!o.isSkinnedMesh;if(o.material?.name?.includes('Cloth'))addMicroSurface(o.material,'fabric',.002);}});model.updateMatrixWorld(true);const box=new T.Box3().setFromObject(model),size=box.getSize(new T.Vector3()),center=box.getCenter(new T.Vector3());const sc=kind.startsWith('citizen')?1:animalAssets[kind]?1:kind==='traffic'?4.7/size.z:1;model.scale.multiplyScalar(sc);model.position.set(-center.x*sc,-box.min.y*sc,-center.z*sc);const span=Math.max(size.x,size.y,size.z)*sc;controls.target.set(0,size.y*sc*.48,0);camera.position.set(span*1.35,span*.8,span*2);controls.update();document.getElementById('status').textContent=kind+' · game mesh';}catch(e){document.getElementById('status').textContent=e.message;document.getElementById('status').className='error';}}
document.getElementById('motion').onclick=()=>{moving=!moving;document.getElementById('motion').textContent=moving?'Pause motion':'Play motion';};document.getElementById('reverse').onclick=()=>{direction*=-1;document.getElementById('reverse').textContent=direction>0?'Reverse':'Forward';};document.querySelectorAll('[data-steer]').forEach(b=>b.onclick=()=>{steer=Number(b.dataset.steer);document.querySelectorAll('[data-steer]').forEach(x=>x.setAttribute('aria-pressed',x===b));});
for(const [key,label] of citizenAssets.filter(([key])=>key!=='michelle')){const b=document.createElement('button');b.dataset.model=key;b.textContent=label;document.querySelector('nav').insertBefore(b,document.querySelector('[data-model=michelle]'));}
document.querySelectorAll('[data-model]').forEach(b=>b.onclick=()=>select(b.dataset.model));select('crowd');let previous=performance.now();function render(now){const dt=Math.min((now-previous)/1000,.05);previous=now;const step=moving?dt:0,speed=moving?3*direction:0;mixer?.update(step);animalAnimation?.update(step,.7);crowdMixers.forEach(m=>m.update(step));vehicle?.update(dt,speed,steer,false,false,false);if(vehicle?.type==='bike')vehicle.group.rotation.z=motorcycleLean(speed*speed*Math.tan(steer)/1.42);if(traffic?.detailWheels)for(const w of traffic.detailWheels){w.rotor.rotation.x+=speed*dt/w.radius;if(w.front)w.pivot.rotation.y=steer;}controls.update();renderer.render(scene,camera);requestAnimationFrame(render)}requestAnimationFrame(render);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></html>
