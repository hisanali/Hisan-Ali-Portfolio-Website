<!doctype html><html lang="en"><meta charset="utf-8"><base href="/evermile/"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Evermile · Model Studio</title>
<style>*{box-sizing:border-box}body{margin:0;background:#d6d8d3;color:#25302b;font-family:system-ui}canvas{display:block}header{position:absolute;left:32px;top:24px}h1{font-size:24px;font-weight:500;margin:0}p{font-size:13px;color:#526057}nav{position:absolute;bottom:26px;left:24px;right:24px;display:flex;flex-wrap:wrap;gap:8px}button,a{padding:12px 16px;border:1px solid #87988b;border-radius:25px;background:#e6e8e1;color:#25302b;font-size:13px;text-decoration:none;cursor:pointer}button[aria-pressed=true]{background:#243b30;color:white}#status{position:absolute;right:28px;top:24px;font-size:12px}#status.error{color:#a62020}</style>
<header><h1>Evermile · Model Studio</h1><p>Drag to orbit · Scroll to zoom · Inspect the actual game models</p></header><span id="status">Loading</span><nav><button data-model="crowd">Crowd</button><button data-model="citizen">Commuter</button><button data-model="citizen1">Backpacker</button><button data-model="citizen2">Older adult</button><button data-model="citizen3">Summer outfit</button><button data-model="citizen4">Curly hair</button><button data-model="citizen5">Daypack</button><button data-model="cow">Cow</button><button data-model="sheep">Sheep</button><button data-model="dog">Dog</button><button data-model="cat">Cat</button><button data-model="traffic">Traffic car</button><button data-model="fox">Fox</button><button data-model="coupe">Sports car</button><button data-model="coach">Coach</button><button data-model="bike">Motorcycle</button><a href="./">Return to driving ↗</a></nav>
<script type="module">
import * as T from './vendor/three.module.js';import {GLTFLoader} from './vendor/loaders/GLTFLoader.js';import {OrbitControls} from './vendor/controls/OrbitControls.js';import {addMicroSurface} from './surface-detail.js?v=20260926-people3';import {Vehicle} from './vehicle.js?v=20260926-people3';
const scene=new T.Scene();scene.background=new T.Color(0xd6d8d3);const camera=new T.PerspectiveCamera(38,innerWidth/innerHeight,.02,200);const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1;document.body.append(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.maxPolarAngle=Math.PI*.49;controls.minDistance=1;controls.maxDistance=35;
scene.add(new T.HemisphereLight(0xffffff,0x7a8274,2));const sun=new T.DirectionalLight(0xfff0dc,3);sun.position.set(7,10,6);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-12,right:12,top:12,bottom:-12});sun.shadow.normalBias=.025;scene.add(sun);const fill=new T.DirectionalLight(0xc5ddff,1.5);fill.position.set(-6,5,-5);scene.add(fill);
const floor=new T.Mesh(new T.PlaneGeometry(200,200),new T.MeshStandardMaterial({color:0xa9afa2,roughness:.9}));floor.rotation.x=-Math.PI/2;floor.position.y=-.01;floor.receiveShadow=true;scene.add(floor);
let model,mixer,vehicle,selection=0;let crowdMixers=[];const cache=new Map();const loader=new GLTFLoader();
async function select(kind){const ticket=++selection;if(model)scene.remove(model);if(vehicle){vehicle.dispose();vehicle=null;}mixer=null;crowdMixers=[];document.querySelectorAll('[data-model]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.model===kind));document.getElementById('status').textContent='Loading '+kind;
try{if(kind==='crowd'){const assets=await Promise.all(Array.from({length:6},(_,i)=>loader.loadAsync('./assets/models/pedestrian-'+i+'.glb')));if(ticket!==selection)return;model=new T.Group();assets.forEach((g,i)=>{g.scene.position.x=(i-2.5)*.72;model.add(g.scene);const mx=new T.AnimationMixer(g.scene);mx.clipAction(g.animations.find(a=>a.name==='Walk')).play().time=i*.17;crowdMixers.push(mx);});scene.add(model);}else if(['coupe','coach','bike'].includes(kind)){vehicle=new Vehicle(scene,kind,'#426e79');model=vehicle.group;}else{const file={citizen:'pedestrian-0',...Object.fromEntries(Array.from({length:6},(_,i)=>['citizen'+i,'pedestrian-'+i])),cow:'cow',sheep:'sheep',dog:'dog',cat:'cat',traffic:'traffic-car',fox:'fox'}[kind];const g=await loader.loadAsync('./assets/models/'+file+'.glb');if(ticket!==selection)return;model=g.scene;scene.add(model);if(g.animations.length){mixer=new T.AnimationMixer(model);mixer.clipAction(g.animations.find(a=>a.name==='Walk')||g.animations[0]).play();}}
model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;if(o.material.name.includes('Cloth'))addMicroSurface(o.material,'fabric',.002);if(['cow','sheep','dog','cat'].includes(kind)&&o.geometry.attributes.uv&&o.material.roughness>.7){addMicroSurface(o.material,kind==='sheep'?'wool':'fur',kind==='sheep'?.008:.002);if(o.material.name.startsWith('Coat')&&['dog','cat'].includes(kind))o.material.color.set(kind==='dog'?0x966e49:0x81776a);}}});model.updateMatrixWorld(true);const box=new T.Box3().setFromObject(model),size=box.getSize(new T.Vector3()),center=box.getCenter(new T.Vector3());const sc=kind.startsWith('citizen')?1:kind==='fox'?.75/size.y:kind==='traffic'?4.7/size.z:1;model.scale.multiplyScalar(sc);model.position.set(-center.x*sc,-box.min.y*sc,-center.z*sc);const span=Math.max(size.x,size.y,size.z)*sc;controls.target.set(0,size.y*sc*.48,0);camera.position.set(span*1.1,span*.65,span*1.65);controls.update();document.getElementById('status').textContent=kind+' · game mesh';}catch(e){document.getElementById('status').textContent=e.message;document.getElementById('status').className='error';}}
document.querySelectorAll('[data-model]').forEach(b=>b.onclick=()=>select(b.dataset.model));select('crowd');let previous=performance.now();function render(now){const dt=Math.min((now-previous)/1000,.05);previous=now;mixer?.update(dt);crowdMixers.forEach(m=>m.update(dt));vehicle?.update(dt,0,0,false,false,false);controls.update();renderer.render(scene,camera);requestAnimationFrame(render)}requestAnimationFrame(render);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></html>
