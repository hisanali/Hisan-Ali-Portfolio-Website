<!doctype html><html><head><style>html,body{margin:0;background:#14262e}canvas{display:block;width:1000px;height:750px}</style></head><body><canvas></canvas><script type="module">
import * as T from '/evermile/vendor/three.module.js';
import {RoundedBoxGeometry} from '/evermile/vendor/geometries/RoundedBoxGeometry.js';

const renderer=new T.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true});renderer.setSize(1000,750);renderer.setPixelRatio(1.5);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
const scene=new T.Scene();scene.background=new T.Color(penalty?'#14334b':'#19383d');scene.fog=new T.Fog(scene.background,17,40);
const camera=new T.PerspectiveCamera(38,4/3,.1,100);camera.position.set(...(penalty?[6,5,10]:[5.4,4.5,7.4]));camera.lookAt(penalty?new T.Vector3(0,1,-.8):new T.Vector3(0,1,0));
scene.add(new T.HemisphereLight(0xb9eaff,0x1c6543,2));const sun=new T.DirectionalLight(0xffe9bd,4);sun.position.set(-4,9,7);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-12,right:12,top:12,bottom:-12,near:.1,far:35});sun.shadow.normalBias=.03;scene.add(sun);const rim=new T.DirectionalLight(0x7ddfff,2);rim.position.set(5,6,-5);scene.add(rim);
const mat=(color,roughness=.62)=>new T.MeshStandardMaterial({color,roughness});const white=mat('#fff4db'),dark=mat('#142736'),skin=mat('#d4a27b');
function mesh(geo,material,parent=scene){const m=new T.Mesh(geo,material);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m;}
function box(w,h,d,material,x,y,z,parent=scene,r=.04){const m=mesh(new RoundedBoxGeometry(w,h,d,2,r),material,parent);m.position.set(x,y,z);return m;}
function rod(a,b,r,material,parent=scene){const av=new T.Vector3(...a),bv=new T.Vector3(...b),delta=bv.clone().sub(av);const m=mesh(new T.CylinderGeometry(r,r,delta.length(),12),material,parent);m.position.copy(av.add(bv).multiplyScalar(.5));m.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),delta.normalize());return m;}

for(let i=0;i<7;i++)box(14.8,.006,1.5,mat(i%2?'#178c58':'#209e68'),0,-.02,-5.5+i*1.5,scene,.001);
const lines=mat('#c9edd3');
rod([-7,.006,5],[7,.006,5],.025,lines);rod([-7,.006,-7],[7,.006,-7],.025,lines);rod([-7,.006,-7],[-7,.006,5],.025,lines);rod([7,.006,-7],[7,.006,5],.025,lines);
if(!penalty){const ring=mesh(new T.TorusGeometry(2.1,.025,6,80),lines);ring.rotation.x=-Math.PI/2;ring.position.set(0,.012,-.1);rod([-7,.01,-.1],[7,.01,-.1],.025,lines);}
else {rod([-4,.01,-6],[-4,.01,0],.025,lines);rod([4,.01,-6],[4,.01,0],.025,lines);rod([-4,.01,0],[4,.01,0],.025,lines);}
// Miniature stadium seats and light pylons, deliberately geometric game art.
const stand=mat('#204854'),seats=[mat('#42b7ba'),mat('#eebf62'),mat('#e76759')];
for(let row=0;row<4;row++){
 box(16,.35,.8,stand,0,.18+row*.45,-7.2-row*.65);
 for(let j=0;j<27;j++)box(.33,.24,.3,seats[(j+row)%3],-7.3+j*.56,.42+row*.45,-7.2-row*.65,scene,.04);
}

function goal(){const z=-4.9;rod([-2.65,0,z],[-2.65,2.65,z],.075,white);rod([2.65,0,z],[2.65,2.65,z],.075,white);rod([-2.65,2.65,z],[2.65,2.65,z],.075,white);const net=mat('#7bacb3');for(let i=0;i<=16;i++){const x=-2.65+i*5.3/16;rod([x,0,z-.85],[x,2.65,z-.85],.011,net);rod([x,2.65,z-.85],[x,2.65,z],.011,net);}for(let i=0;i<=9;i++){const y=i*2.65/9;rod([-2.65,y,z-.85],[2.65,y,z-.85],.011,net);}rod([-2.65,0,z],[-2.65,0,z-.85],.035,white);rod([2.65,0,z],[2.65,0,z-.85],.035,white);}
if(penalty)goal();
// Faceless, rounded action figures give these covers a clear videogame identity.
function player({pos,color,pose='run',rotation=0}){
 const p=new T.Group();scene.add(p);p.position.set(...pos);p.rotation.y=rotation;
 const shirt=mat(color),shorts=mat('#f7eee0'),sock=mat(color),boots=mat('#192637');
 box(.64,.76,.36,shirt,0,1.43,0,p,.13);box(.65,.28,.38,shorts,0,.94,0,p,.07);
 const head=mesh(new T.SphereGeometry(.255,20,16),skin,p);head.position.set(0,2.12,-.015);const hair=mesh(new T.SphereGeometry(.258,20,12,0,Math.PI*2,0,1.45),dark,p);hair.position.copy(head.position);
 const arms=pose==='keeper'?[[[-.36,1.68,0],[-.85,1.99,-.04],[-1.23,2.17,0]],[[.36,1.68,0],[.83,2.01,-.04],[1.23,2.17,0]]]:[[[-.36,1.68,0],[-.65,1.35,.15],[-.76,1.17,-.12]],[[.36,1.68,0],[.64,1.78,-.21],[.78,1.95,-.35]]];
 for(const a of arms){rod(a[0],a[1],.115,shirt,p);rod(a[1],a[2],.09,skin,p);const hand=mesh(new T.SphereGeometry(pose==='keeper'?.145:.10,12,10),pose==='keeper'?white:skin,p);hand.position.set(...a[2]);}
 const legs=pose==='kick'?[[[-.19,.88,0],[-.30,.45,.2],[-.30,.14,.25]],[[.19,.88,0],[.35,.6,-.32],[.38,.45,-.8]]]:[[[-.19,.88,0],[-.30,.43,-.2],[-.30,.15,-.5]],[[.19,.88,0],[.28,.62,.45],[.33,.25,.68]]];
 for(const leg of legs){rod(leg[0],leg[1],.135,shorts,p);rod(leg[1],leg[2],.10,sock,p);box(.26,.18,.43,boots,leg[2][0],leg[2][1]-.04,leg[2][2]-.08,p,.07);}
 // One unbranded back number, built as geometry rather than a photo texture.
 box(.065,.3,.012,white,.04,1.47,.186,p,.003);box(.19,.05,.012,white,-.02,1.61,.187,p,.003);
 return p;
}
function ball(x,y,z,size=.38){const group=new T.Group();scene.add(group);group.position.set(x,y,z);mesh(new T.SphereGeometry(size,32,24),white,group);
 const ico=new T.IcosahedronGeometry(1,0),points=ico.attributes.position;const seen=new Set();for(let i=0;i<points.count;i++){const n=new T.Vector3().fromBufferAttribute(points,i).normalize(),key=n.toArray().map(v=>v.toFixed(3)).join();if(seen.has(key))continue;seen.add(key);const patch=mesh(new T.CircleGeometry(size*.22,5),dark,group);patch.position.copy(n.clone().multiplyScalar(size*1.001));patch.quaternion.setFromUnitVectors(new T.Vector3(0,0,1),n);}return group;}
if(penalty){
 const keeper=player({pos:[.1,1.25,-4.5],color:'#f1c342',pose:'keeper'});keeper.rotation.z=-.85;keeper.rotation.y=Math.PI+.15;
 const striker=player({pos:[-1.2,0,1.4],color:'#318bd4',pose:'kick',rotation:.28});
 ball(.8,.7,-1.15,.43);
 // A restrained curved shot trail makes the action read as game cover artwork.
 const points=[new T.Vector3(.9,.35,.6),new T.Vector3(.8,.7,-1.15),new T.Vector3(1.1,1.4,-3)];const trail=mesh(new T.TubeGeometry(new T.CatmullRomCurve3(points),32,.027,6,false),new T.MeshBasicMaterial({color:'#dfff93',transparent:true,opacity:.7}));
}else{
 player({pos:[-.5,0,1],color:'#e34a43',pose:'kick',rotation:-.4});player({pos:[1.65,0,-.55],color:'#378cdb',rotation:1.3});player({pos:[-2.8,0,-2.8],color:'#378cdb',rotation:.7});ball(-.2,.39,-.15,.39);
}
renderer.render(scene,camera);document.title='Sports game cover ready';
</script></body></html>
